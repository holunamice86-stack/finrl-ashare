<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 选股 · 盯盘</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1e2740; --border: #2a3452;
    --text: #e8ecf5; --dim: #8a94ad; --green: #2dd4a0; --red: #ff6b6b; --blue: #4da6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Microsoft YaHei", "PingFang SC", sans-serif; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--dim); }
  input { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
          border-radius: 8px; padding: 8px 10px; font-size: 14px; min-width: 150px; }
  button { border: 0; border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer; }
  .btn-run { background: var(--green); color: #06281d; font-weight: bold; }
  .btn-stop { background: #3a4157; color: var(--text); }
  .msg { font-size: 13px; margin: 6px 0; min-height: 18px; }
  .msg.ok { color: var(--green); } .msg.err { color: var(--red); }
  .metric { display: inline-block; background: var(--panel2); border: 1px solid var(--border);
            border-radius: 8px; padding: 4px 9px; margin: 3px; font-size: 13px; }
  .tier { background: var(--panel2); border-radius: 10px; padding: 12px; margin: 10px 0; }
  .tier b.t { font-size: 15px; }
  .chg-up { color: var(--green); } .chg-dn { color: var(--red); }
  .badge { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 12px;
           background: var(--panel2); color: var(--dim); }
  .livegrid { display: flex; flex-wrap: wrap; gap: 14px; }
  .livebox { flex: 1 1 380px; min-width: 300px; }
  canvas { width: 100%; background: var(--panel2); border-radius: 8px; }
  .note { font-size: 11px; color: var(--dim); margin-top: 3px; }
  @media (max-width: 600px) { .field input { width: 100%; } }
</style>
</head>
<body>

<h1>📈 AI 选股 · 盯盘</h1>
<div class="sub">模型: 风险敏感强化学习（CPPO-DeepSeek）· 50只A股 + 19个市场特征 · 数据截止 <span id="dataDate">—</span>
 · <a id="fullLink" href="/static/index_full.html" style="color:var(--dim)">旧版完整操作台</a></div>
<div id="connBar" class="badge" style="color:var(--dim)">⏳ 连接检测中…</div>

<!-- ① AI 选股榜 -->
<div class="card">
  <h2>🎯 AI 选股榜（一线 / 二线 / 三线）· 择时由你决定</h2>
  <div class="row">
    <div class="field"><label>我可投入资金(元)</label><input id="advCapital" type="number" value="0" min="0" step="1000" placeholder="0 = 不限"></div>
    <button class="btn-run" onclick="genTiers()">🔍 生成选股榜</button>
    <span class="badge" id="tiersStatus">未生成</span>
  </div>
  <div class="msg" id="tiersMsg"></div>
  <div id="tiersArea"></div>
</div>

<!-- ② AI 盯盘板 -->
<div class="card">
  <h2>👁 AI 盯盘板（实时价格 · 模型实时信号）</h2>
  <div class="row">
    <div class="field" style="flex:2"><label>股票代码（2-3只，逗号分隔）</label>
      <input id="liveTics" placeholder="如 600519,300750,688981" style="min-width:240px"></div>
    <button class="btn-run" onclick="startLive()">▶ 开始盯盘</button>
    <button class="btn-stop" onclick="stopLive()">■ 停止</button>
    <span class="badge" id="liveStatus">未开始</span>
  </div>
  <div class="msg" id="liveMsg"></div>
  <div class="livegrid" id="liveArea"></div>
</div>

<script>
// localhost 在部分浏览器优先走 IPv6, 服务器只监听 IPv4 —— 强制 127.0.0.1
if (location.hostname === 'localhost') {
  location.replace('http://127.0.0.1:' + (location.port || '8000') + location.pathname + location.search);
}

let liveTimer = null, liveTicsSel = '', liveMuHist = {};
const nm = x => x && x.name ? x.name + ' ' + x.tic : (x ? x.tic : '');

// ---- 统一请求: 401 时弹框要密钥 ----
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 401) {
    const k = prompt('请输入访问密钥（输入一次, 记住30天）：');
    if (k) location.href = '/?key=' + encodeURIComponent(k.trim());
    throw new Error('auth');
  }
  return r.json();
}

// ---- 连接状态灯（页面加载即检测） ----
async function initConn() {
  const bar = document.getElementById('connBar');
  bar.textContent = '⏳ 连接检测中…'; bar.style.color = 'var(--dim)';
  try {
    const s = await api('/api/status?_=' + Date.now(), { cache: 'no-store' });
    bar.textContent = '✅ 已连接服务器 · 一切就绪';
    bar.style.color = 'var(--green)'; bar.style.cursor = 'default';
    try {
      const n = await api('/api/news-info?_=' + Date.now(), { cache: 'no-store' });
      const ds = n.covered_dates || [];
      if (ds.length) document.getElementById('dataDate').textContent = ds[ds.length - 1];
    } catch (e) {}
  } catch (e) {
    if (e.message === 'auth') { bar.textContent = '🔑 需要输入访问密钥'; bar.style.color = 'var(--red)'; return; }
    bar.textContent = '❌ 未连接服务器 · 点我重试（或双击「启动操作台.bat」）';
    bar.style.color = 'var(--red)'; bar.style.cursor = 'pointer';
    bar.onclick = initConn;
  }
}
initConn();

// ---- AI 选股榜 ----
async function genTiers() {
  const msg = document.getElementById('tiersMsg');
  msg.textContent = '已提交，后台依次生成三个池…'; msg.className = 'msg';
  try {
    const capital = parseFloat(document.getElementById('advCapital').value) || 0;
    const r = await fetch('/api/advice-tiers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ capital: capital }) });
    const d = await r.json();
    if (!d.ok && r.status !== 409) { msg.textContent = d.msg; msg.className = 'msg err'; return; }
    const poll = async (fails) => {
      try {
        const s = await api('/api/advice-tiers-status?_=' + Date.now(), { cache: 'no-store' });
        if (s.running) {
          msg.textContent = '生成中 ' + s.done + '/' + s.total + ' 层…';
          if (s.tiers && s.tiers.length) renderTiers(s.tiers);
          setTimeout(() => poll(0), 2000); return;
        }
        if (s.result && s.result.ok) {
          msg.textContent = '已生成'; msg.className = 'msg ok';
          document.getElementById('tiersStatus').textContent = '已更新';
          renderTiers(s.result.tiers);
          return;
        }
        msg.textContent = '生成失败: ' + (s.error || '未知错误'); msg.className = 'msg err';
      } catch (e) {
        if (e.message === 'auth') return;
        if (fails < 50) {
          msg.textContent = '连接抖动，自动重试中（' + (fails + 1) + '/50）…';
          setTimeout(() => poll(fails + 1), 2000);
        } else {
          msg.textContent = '浏览器本地网络持续异常，请再点一次按钮'; msg.className = 'msg err';
        }
      }
    };
    poll(0);
  } catch (e) { msg.textContent = '提交失败，请确认操作台在运行'; msg.className = 'msg err'; }
}

function renderTiers(tiers) {
  document.getElementById('tiersArea').innerHTML = (tiers || []).map(t => {
    const x = t.data, c = x.context || {};
    const pct = v => (v != null ? (v >= 0 ? '+' : '') + v + '%' : '—');
    const chips = (x.ranking || []).slice(0, 5).map(rr => {
      const sc = rr.score >= 0 ? 'var(--green)' : 'var(--red)';
      const ns = rr.sent >= 4 ? 'var(--green)' : (rr.sent <= 2 ? 'var(--red)' : 'var(--dim)');
      return `<span class="metric">${nm(rr)} <b style="color:${sc}">${rr.score>=0?'+':''}${rr.score}</b>
        · 今日<b class="${rr.chg>=0?'chg-up':'chg-dn'}">${rr.chg!=null?(rr.chg>=0?'+':'')+rr.chg+'%':'—'}</b>
        · 20日${rr.mom20!=null?rr.mom20+'%':'—'} · 新闻<b style="color:${ns}">${rr.sent}分</b></span>`;
    }).join('');
    const buys = (x.buy_orders || []).map(b => `<span class="metric">${nm(b)} <b>+${b.shares}股</b> @${b.price}</span>`).join('') || '<span class="metric">该层无买入建议</span>';
    return `<div class="tier">
      <b class="t">${t.label}</b>
      <span style="font-size:11px;color:var(--dim)"> · ${x.date} · ${x.mode} · ${x.model}</span>
      <div style="font-size:12px;color:var(--dim);margin:4px 0 6px">📊 择时参考: 上证20日 <b>${pct(c.idx_sh_mom20)}</b> · 成交指标 ${c.idx_turnover ?? '—'} · 上涨家数 <b>${pct(c.idx_breadth)}</b> · 主力净流入 ${c.idx_mf_net != null ? c.idx_mf_net + '亿' : '—'} · 波动率 <b>${pct(c.idx_vol20)}</b>（涨跌节奏你定）</div>
      <div style="font-size:12px;color:var(--dim)">🏆 前5（强弱排序）</div><div>${chips}</div>
      <div style="font-size:12px;color:var(--green);margin-top:5px">💡 参考买入</div><div>${buys}</div>
    </div>`;
  }).join('');
}

// ---- AI 盯盘板 ----
function stopLive() { if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  document.getElementById('liveStatus').textContent = '已停止'; }

async function startLive() {
  const tics = document.getElementById('liveTics').value.trim();
  const msg = document.getElementById('liveMsg');
  if (!tics) { msg.textContent = '请先输入股票代码'; msg.className = 'msg err'; return; }
  stopLive(); liveTicsSel = tics; liveMuHist = {};
  msg.textContent = '盯盘中（每 5 秒刷新）…'; msg.className = 'msg';
  document.getElementById('liveStatus').textContent = '盯盘中';
  await pollLive();
  if (!liveTimer) liveTimer = setInterval(pollLive, 5000);
}

async function pollLive() {
  const msg = document.getElementById('liveMsg');
  try {
    const d = await api('/api/live-panel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tics: liveTicsSel }) });
    if (d.ok) renderLive(d);
    else msg.textContent = d.msg;
  } catch (e) { if (e.message !== 'auth') msg.textContent = '刷新失败（自动继续重试）…'; }
}

function drawLine(canvas, series, opts) {
  const ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  if (!series || series.length < 2) { ctx.fillStyle = '#888'; ctx.fillText('数据不足…', 12, 24); return; }
  const vals = series.map(s => s[1]);
  let lo = opts.min != null ? opts.min : Math.min(...vals);
  let hi = opts.max != null ? opts.max : Math.max(...vals);
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const x = i => 40 + i * (W - 50) / (series.length - 1);
  const y = v => H - 18 - (v - lo) / (hi - lo) * (H - 40);
  (opts.thresholds || []).forEach(th => {
    if (th.y < lo || th.y > hi) return;
    ctx.strokeStyle = th.color; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(40, y(th.y)); ctx.lineTo(W - 10, y(th.y)); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = th.color; ctx.fillText(th.label, 44, y(th.y) - 3);
  });
  ctx.strokeStyle = opts.color; ctx.lineWidth = 1.6; ctx.beginPath();
  series.forEach((s, i) => {
    if (opts.dashFrom != null && i >= opts.dashFrom) ctx.setLineDash([4, 4]); else ctx.setLineDash([]);
    if (i === 0) ctx.moveTo(x(i), y(s[1])); else ctx.lineTo(x(i), y(s[1]));
  });
  ctx.stroke(); ctx.setLineDash([]);
  const last = series[series.length - 1];
  ctx.fillStyle = opts.color;
  ctx.fillText(String(last[1]), Math.min(x(series.length - 1) + 4, W - 40), Math.max(y(last[1]) - 4, 12));
}

function renderLive(d) {
  document.getElementById('liveArea').innerHTML = d.tics.map(t => {
    if (!t.in_pool) return `<div class="livebox" style="color:var(--red)">${t.tic} 不在股票池</div>`;
    const cc = t.chg >= 0 ? 'chg-up' : 'chg-dn';
    const sc = t.signal.includes('卖') ? 'var(--red)' : (t.signal.includes('买') ? 'var(--green)' : 'var(--dim)');
    return `<div class="livebox">
      <b>${t.name || ''} ${t.tic}</b>
      <span class="${cc}"> ${t.chg != null ? (t.chg >= 0 ? '+' : '') + t.chg + '%' : '—'}</span>
      <span> · ¥${t.price}</span>
      <span style="font-size:11px;color:var(--dim)"> · ${t.session}（${t.mode}）</span>
      <canvas id="cv_${t.tic}" width="520" height="190"></canvas>
      <div class="note">5分钟K线收盘；虚线 = 动量外推（数学外推，非预测）</div>
      <div style="margin-top:8px"><b>AI 信号</b> <span style="color:${sc}">${t.signal}（μ=${t.mu >= 0 ? '+' : ''}${t.mu}）</span></div>
      <canvas id="cv_ai_${t.tic}" width="520" height="190"></canvas>
      <div class="note">模型偏好分 μ 随价格实时变化；±0.3 虚线 = 强烈买/卖区</div>
    </div>`;
  }).join('');
  d.tics.forEach(t => {
    if (!t.in_pool) return;
    const bars = (t.bars || []).slice(), extrap = t.extrap || [];
    if (bars.length >= 2) {
      let series = bars, dashFrom = null;
      if (extrap.length) { series = bars.concat(extrap); dashFrom = bars.length; }
      drawLine(document.getElementById('cv_' + t.tic), series, { color: '#4da6ff', dashFrom: dashFrom });
    }
    liveMuHist[t.tic] = liveMuHist[t.tic] || [];
    liveMuHist[t.tic].push([new Date().toTimeString().slice(0, 5), t.mu]);
    if (liveMuHist[t.tic].length > 150) liveMuHist[t.tic].shift();
    drawLine(document.getElementById('cv_ai_' + t.tic), liveMuHist[t.tic], {
      color: '#22c55e', min: -0.6, max: 0.6,
      thresholds: [{ y: 0.3, color: '#22c55e', label: '+0.3 强烈买入' },
                   { y: -0.3, color: '#ef4444', label: '-0.3 强烈卖出' },
                   { y: 0, color: '#888', label: '0' }]
    });
  });
}
</script>
</body>
</html>
